name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run demo:generate
      - name: Build the demo for GitHub Pages
        run: npx ng build --base-href /ng-typed-routes/
        working-directory: examples/demo-app
      - name: SPA fallback
        run: cp examples/demo-app/dist/demo-app/browser/index.html examples/demo-app/dist/demo-app/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/demo-app/dist/demo-app/browser
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
