name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Angular 22 requires Node ^22.22 or ^24.15; Node 20 is not supported by Angular 22.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Generated routes in the demo app are current
        run: npm run demo:check
      - run: npm run demo:build
      - name: Broken typed links fail the Angular compiler
        run: npm run demo:verify-type-errors
